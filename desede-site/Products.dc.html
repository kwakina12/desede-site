<style>
body{margin:0;background:#FFFFFF;color:#111111;font-family:'Pretendard','Noto Sans KR',sans-serif;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:inherit;text-decoration:none}
h1,h2,h3,p{margin:0}
.serif{font-family:'Arsenica Trial','Bodoni Moda',serif;font-weight:400}
.page{position:relative;width:100%;overflow:hidden}
.in{max-width:1440px;margin:0 auto;padding:0 60px}
.ph{background:#e7e0d5;color:#785741;display:flex;align-items:center;justify-content:center;font-size:12px;letter-spacing:.12em;text-transform:uppercase;text-align:center;padding:8px}
.ph.dk{background:#2b2a28;color:#d8cfc2}
.ph.br{background:#785741;color:#FBF8F3}
.ph{position:relative;overflow:hidden}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.sub .ph::after{content:"";position:absolute;inset:0;background:rgba(17,17,17,.38)}

.house-row .ph img,.grid .ph img{transition:transform .6s ease}

.tag{display:inline-block;border:1px solid #BD9257;color:#785741;border-radius:999px;font-size:10px;letter-spacing:.14em;padding:3px 14px}
.lead{font-size:14px;line-height:1.9;color:#3a3633;font-weight:300}
.sub{position:relative;height:max(520px,41.667vw);color:#FBF8F3;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.sub .ph{position:absolute;inset:0}
.sub h1{position:relative;font-size:64px;line-height:1.1}

.coll{padding:120px 0 0}

.pager span{font-size:20px;min-width:52px;text-align:center}
@media (max-width:1024px){

@media (max-width:720px){

/* safety: images always fill their frame */
.ph > img{inset:0 !important;width:100% !important;height:100% !important;max-width:none !important}
@media (prefers-reduced-motion:no-preference){
  .rv-on .rvl{opacity:0;transform:translateY(28px);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.7,.2,1)}
  .rv-on .rvl.rv-in{opacity:1;transform:none}

  .rv-on .house-row figure:nth-child(4),.rv-on .collage .c2{transition-delay:.36s}
  .rv-on .quote.rvl{opacity:1;transform:none}
  .rv-on .quote .ph > img{transform:scale(1.08);transition:transform 1.8s cubic-bezier(.2,.7,.2,1)}
  .rv-on .quote.rv-in .ph > img{transform:none}
  .rv-on .quote h2{opacity:0;transform:translateY(20px);transition:opacity 1s ease .3s,transform 1s cubic-bezier(.2,.7,.2,1) .3s}
  .rv-on .quote.rv-in h2{opacity:1;transform:none}
}
/* review slide change */
.rv-f img{opacity:0}
.rv-f img.on{opacity:1;z-index:1;animation:rvNext 1s cubic-bezier(.7,0,.2,1) both}
.rv-f img.was{opacity:1;z-index:0}
.rv-f.prev img.on{animation-name:rvPrev}
.rv-b.rv-f img.on{animation-delay:.1s}
@keyframes rvNext{from{clip-path:inset(0 0 0 100%);transform:scale(1.06)}to{clip-path:inset(0 0 0 0);transform:none}}
@keyframes rvPrev{from{clip-path:inset(0 100% 0 0);transform:scale(1.06)}to{clip-path:inset(0 0 0 0);transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>

    const reviews = [
      { a: '/_blob/22b8f28110039e2df1fd25a23a882cb1.webp', b: '/_blob/8db705f679914e5392394394ec20b6ca.webp', text: '거실에 두는 순간 공간의 분위기가 달라졌어요. 가죽 촉감이 정말 부드럽습니다.', who: '김서연 · DS-707' },
      { a: '/_blob/59bcd66b7f89f4a10885f77654ff6fbe.webp', b: '/_blob/57247656a50fdea7f94f636de015d088.webp', text: '3년째 사용 중인데 처음보다 더 멋스럽게 길들여졌어요.', who: 'Daniel K. · DS-21' },
      { a: '/_blob/7bd564fcf84df75b550152eb3fb67f64.webp', b: '/_blob/1afa1d068137b15478c443c4c2f64a4c.webp', text: '모듈을 이리저리 바꿔 배치할 수 있어서 이사 후에도 그대로 쓰고 있습니다.', who: '이준호 · DS-600' },
      { a: '/_blob/1afa1d068137b15478c443c4c2f64a4c.webp', b: '/_blob/87bb31acf5d01c9b587ad0e31e07264f.webp', text: '쇼룸에서 직접 앉아보고 결정했어요. 상담도 친절했습니다.', who: '박지민 · DS-164' },
      { a: '/_blob/57247656a50fdea7f94f636de015d088.webp', b: '/_blob/22b8f28110039e2df1fd25a23a882cb1.webp', text: '배송까지 오래 걸렸지만 기다린 보람이 있는 완성도예요.', who: 'Sophie L. · DS-161' }
    ];
    const ri = this.state.rv;
    return {
      items: names.map((n, i) => ({ name: n, price: prices[i % prices.length], img: imgs[i % imgs.length], cut: cuts[i % cuts.length], liked: likes[n] ? 'true' : 'false', likeCls: likes[n] ? 'on' : '', like: () => this.setState({ likes: { ...likes, [n]: !likes[n] } }) })),
      pageRef: (el) => { this.pageEl = el; },
      rvFrameA: 'ph br rv-a rv-f' + (this.state.rvDir === 'prev' ? ' prev' : ''),
      rvFrameB: 'ph rv-b rv-f' + (this.state.rvDir === 'prev' ? ' prev' : ''),
      rvA: reviews.map((r, i) => ({ src: r.a, cls: i === ri ? 'on' : (i === this.state.rvWas ? 'was' : '') })),
      rvB: reviews.map((r, i) => ({ src: r.b, cls: i === ri ? 'on' : (i === this.state.rvWas ? 'was' : '') })),
      rvCaps: reviews.map((r, i) => ({ text: r.text, who: r.who, cls: i === ri ? 'on' : '' })),
      rvNo: ri + 1,
      rvPrev: () => this.setState({ rvWas: ri, rvDir: 'prev', rv: (ri + 4) % 5 }),
      rvNext: () => this.setState({ rvWas: ri, rvDir: 'next', rv: (ri + 1) % 5 })
    };
  }
